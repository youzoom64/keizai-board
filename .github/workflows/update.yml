name: データ更新

# 1日2回。朝は前日の米国市場の確定値、夕方はその日の国債金利と株価を拾う狙い。
# cron は UTC なので、22:10 UTC = 翌 07:10 JST、09:40 UTC = 18:40 JST。
on:
  schedule:
    - cron: "10 22 * * *"
    - cron: "40 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - "collector/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: 依存を入れる
        run: pip install -r collector/requirements.txt

      - name: 取得してJSONを書き出す
        env:
          KEIZAI_NO_RAW: "1"
        run: python -m collector.export

      - name: 変わっていれば commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "データ更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
